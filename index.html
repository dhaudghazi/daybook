function wireHabits(s){document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{day(s).done[e.dataset.check]=e.checked;save();render()});document.querySelectorAll('[data-checklabel]').forEach(e=>e.onclick=()=>{let id=e.dataset.checklabel;day(s).done[id]=!day(s).done[id];save();render()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{if(confirm('Remove this habit from your checklist?')){data.habits=data.habits.filter(h=>h.id!==e.dataset.remove);save();render()}})}function addHabit(){let name=prompt('Name your new habit');if(!name?.trim())return;data.habits.push({id:'h'+Date.now(),name:name.trim(),category:'Personal'});save();render()}

n value="">Free</option><option value="busy" ${v==='busy'?'selected':''}>Busy / unavailable</option>${data.habits.map(hab=>`<option value="${hab.id}" ${v===hab.id?'selected':''}>${esc(hab.name)}</option>`).join('')}</select></div>`}).join('')}</div></div>`;$('prevMonth').onclick=()=>shiftMonth(-1);$('nextMonth').onclick=()=>shiftMonth(1);document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});$('workSelected').onchange=e=>{d.work=e.target.checked;save();render()};document.querySelectorAll('[data-hour]').forEach(x=>x.onchange=e=>{d.slots[e.target.dataset.hour]=e.target.value;save();render()});wireHabits(selected)}function shiftMonth(n){let [y,m]=month.split('-').map(Number);let d=new Date(y,m-1+n,1);month=localDate(d).slice(0,7);render()}
function renderJournal(){$('journal').innerHTML=`<div class="hero"><div><div class="muted">A space to slow down</div><h1>Your journal.</h1><p>Capture the ordinary moments that matter.</p></div></div><div class="panel stack"><div class="sectiontitle"><h2>Write for a day</h2><input class="field" type="date" id="journalDate" value="${selected}" style="max-width:175px"></div><div class="journaldate">${fmt(selected)}</div><label>Gratitude journal</label><textarea class="field" id="gratJournal" placeholder="Today I'm thankful for…" style="min-height:140px">${esc(day().gratitude)}</textarea><label>Daily journal</label><textarea class="field" id="normalJournal" placeholder="What's on your mind? What did you learn? How did today feel?" style="min-height:270px">${esc(day().journal)}</textarea><div class="muted">Saved automatically to your account as you type.</div></div>`;$('journalDate').onchange=e=>{selected=e.target.value;month=selected.slice(0,7);render()};$('gratJournal').oninput=e=>{day().gratitude=e.target.value;save()};$('normalJournal').oninput=e=>{day().journal=e.target.value;save()}}
function weekStart(){let d=parseDate(localDate());d.setDate(d.getDate()-(d.getDay()+6)%7+weekOffset*7);return d}function renderFinance(){let start=weekStart(),end=new Date(start);end.setDate(end.getDate()+6);let a=localDate(start),b=localDate(end),tx=data.transactions.filter(t=>t.date>=a&&t.date<=b).sort((x,y)=>y.date.localeCompare(x.date)),income=tx.filter(t=>t.type==='income').reduce((v,t)=>v+t.amount,0),expense=tx.filter(t=>t.type==='expense').reduce((v,t)=>v+t.amount,0),gbp=v=>v.toLocaleString('en-GB',{style:'currency',currency:'GBP'});$('finance').innerHTML=`<div class="hero"><div><div class="muted">Your weekly money check-in</div><h1>Finances.</h1><p>Know what comes in and what goes out.</p></div></div><div class="panel stack"><div class="sectiontitle"><h2>Weekly overview</h2><div class="weeknav"><button class="secondary" id="prevWeek">←</button><span class="muted">${fmt(a,{day:'numeric',month:'short'})} – ${fmt(b,{day:'numeric',month:'short'})}</span><button class="secondary" id="nextWeek">→</button></div></div><div class="money"><div class="mini"><span class="muted">Income</span><strong>${gbp(income)}</strong></div><div class="mini"><span class="muted">Expenses</span><strong>${gbp(expense)}</strong></div><div class="mini"><span class="muted">Remaining</span><strong>${gbp(income-expense)}</strong></div></div><h2 style="font-family:Georgia,serif;font-weight:400">Add transaction</h2><form id="txForm" class="formrow"><input class="field" name="desc" placeholder="e.g. Weekend shift" required><input class="field" name="amount" type="number" min="0.01" step="0.01" placeholder="£ Amount" required><select class="field" name="type"><option value="income">Income</option><option value="expense">Expense</option></select><button class="primary">Add</button><input class="field" type="date" name="date" value="${a}" style="grid-column:1/-1"></form><h2 style="font-family:Georgia,serif;font-weight:400">Transactions</h2><div>${tx.length?tx.map(t=>`<div class="transaction"><div> function validatePayload(x){return x&&Array.isArray(x.habits)&&typeof x.days==='object'&&x.days!==null&&Array.isArray(x.transactions)}
function setSync(t,warn=false){$('syncState').textContent=t;$('syncState').classList.toggle('warn',warn)}
function queueCloudSave(){if(!currentUser)return;dirty=true;localStorage.setItem(cacheKey(),JSON.stringify(data));localStorage.setItem(cacheKey()+'_pending','1');setSync('Saving…');clearTimeout(writeTimer);writeTimer=setTimeout(flushCloudSave,650)}
async function flushCloudSave(){if(!currentUser||writing||!dirty)return;const userId=currentUser.id;dirty=false;writing=true;const snapshot=JSON.stringify(data);try{const {data:row,error}=await client.from('daybook_data').upsert({user_id:userId,payload:JSON.parse(snapshot),updated_at:new Date().toISOString()},{onConflict:'user_id'}).select('updated_at').single();if(error)throw error;if(currentUser?.id===userId){cloudStamp=row.updated_at;if(!dirty)localStorage.removeItem(cacheKey()+'_pending');setSync(dirty?'Saving…':'✓ Synced')}}catch(e){dirty=true;setSync('Offline / not synced',true);console.error('Daybook cloud save:',e)}finally{writing=false;if(dirty&&navigator.onLine){clearTimeout(writeTimer);writeTimer=setTimeout(flushCloudSave,1500)}}}
async function loadCloud(){setSync('Loading…');const {data:row,error}=await client.from('daybook_data').select('payload,updated_at').eq('user_id',currentUser.id).maybeSingle();if(error)throw error;cloudStamp=row?.updated_at||'';let cached=null;try{cached=JSON.parse(localStorage.getItem(cacheKey()))}catch{}if(row&&validatePayload(row.payload)){data=(localStorage.getItem(cacheKey()+'_pending')==='1'&&validatePayload(cached))?cached:row.payload;if(data===cached)dirty=true}else if(row){throw new Error('Unexpected cloud data format')}else{data=defaults();dirty=true}if(!row&&validatePayload(cached)){// Prefer explicitly saved cache if the account has no server row.
  data=cached;dirty=true;
}
selected=localDate();month=selected.slice(0,7);render();$('authscreen').hidden=true;$('appRoot').hidden=false;let old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch{}$('importOld').hidden=!!row||!validatePayload(old);if(dirty)await flushCloudSave();else setSync('✓ Synced');
if(realtimeChannel)await client.removeChannel(realtimeChannel);
realtimeChannel=client.channel('daybook-'+currentUser.id).on('postgres_changes',{event:'*',schema:'public',table:'daybook_data',filter:`user_id=eq.${currentUser.id}`},async payload=>{if(!currentUser||dirty||writing)return;const incoming=payload.new;if(!incoming||!validatePayload(incoming.payload)||incoming.updated_at===cloudStamp)return;cloudStamp=incoming.updated_at;data=incoming.payload;localStorage.setItem(cacheKey(),JSON.stringify(data));render();setSync('✓ Synced')}).subscribe();
}
async function showSignedOut(){clearTimeout(writeTimer);currentUser=null;dirty=false;writing=false;data=defaults();$('appRoot').hidden=true;$('authscreen').hidden=false;setSync('Signed out');$('authMessage').textContent='';if(realtimeChannel&&client){await client.removeChannel(realtimeChannel);realtimeChannel=null}}
async function loginUser(session){if(!session?.user)return;if(loadingUser)return loadingUser;currentUser=session.user;loadingUser=(async()=>{try{await loadCloud()}catch(e){$('authMessage').textContent='Unable to load your account: '+e.message;setSync('Sync error',true);$('appRoot').hidden=true;$('authscreen').hidden=false}finally{loadingUser=null}})();return loadingUser}
function authMsg(message,ok=false){$('authMessage').textContent=message;$('authMessage').className=ok?'authok':'autherr'}
async function init(){if(!configured||!window.supabase){authMsg('Website setup required: enter your Supabase project URL and publishable key in config.js.');$('loginButton').disabled=true;$('signupButton').disabled=true;$('resetButton').disabled=true;return}client=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:sessionData,error}=await client.auth.getSession();if(error)authMsg(error.message);if(sessionData?.session)await loginUser(sessionData.session);client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){void showSignedOut()}else if(event==='SIGNED_IN'&&session&&session.user.id!==currentUser?.id){void loginUser(session)}})}
$('authForm').onsubmit=async e=>{e.preventDefault();authMsg('');$('loginButton').disabled=true;try{const {data:result,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await loginUser(result.session)}catch(e){authMsg(e.message)}finally{$('loginButton').disabled=false}};
$('signupButton').onclick=async()=>{authMsg('');try{if(!$('authForm').reportValidity())return;const {data:result,error}=await client.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(result.session)await loginUser(result.session);else authMsg('Account created. Check your email for the confirmation link, then sign in.',true)}catch(e){authMsg(e.message)}};
$('resetButton').onclick=async()=>{const email=$('email').value.trim();if(!email){authMsg('Enter your email address first.');return}try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;authMsg('If the email is registered, a password reset link has been sent.',true)}catch(e){authMsg(e.message)}};
$('logout').onclick=async()=>{if(dirty)await flushCloudSave();if(dirty&&!confirm('Changes have not synced. Sign out anyway?'))return;const {error}=await client.auth.signOut();if(error)alert(error.message)};
$('importOld').onclick=()=>{let old;try{old=JSON.parse(localStorage.getItem(KEY))}catch{}if(!validatePayload(old))return;if(!confirm('Replace your current Daybook account data with the old data stored in this browser? This cannot be undone unless you have a backup.'))return;data=old;$('importOld').hidden=true;queueCloudSave();render()};
window.addEventListener('online',()=>{if(dirty)void flushCloudSave()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)void flushCloudSave()});
init();
</script></body></html>
